        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        img { width: 100%; display: block; border-bottom: 1px solid #eee; }
        .btn { display: block; background: #0056b3; color: white; text-align: center; padding: 18px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 20px; }
